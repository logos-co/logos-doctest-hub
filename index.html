<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logos Doc-Test Reports</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --active-bg: #1e3a5f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    header .subtitle {
      color: var(--muted);
      font-size: 13px;
    }
    .controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .version-select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .version-select.hidden { display: none; }
    .os-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }
    .os-toggle button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .os-toggle button.active {
      background: var(--accent);
      color: #fff;
    }
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    #sidebar {
      width: 300px;
      flex-shrink: 0;
      overflow: auto;
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 8px 0 24px;
    }
    .repo-block { margin-bottom: 4px; }
    .repo-label {
      padding: 10px 16px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .tutorial-link {
      display: block;
      padding: 6px 16px 6px 20px;
      color: var(--text);
      text-decoration: none;
      border-left: 3px solid transparent;
    }
    .tutorial-link:hover {
      background: rgba(59, 130, 246, 0.08);
    }
    .tutorial-link.active {
      background: var(--active-bg);
      border-left-color: var(--accent);
      color: #fff;
    }
    #view {
      flex: 1;
      border: 0;
      width: 100%;
      background: #fff;
    }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      padding: 40px;
      text-align: center;
    }
    .empty-state.hidden { display: none; }
    .hidden { display: none !important; }
    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      #sidebar { width: 100%; max-height: 35vh; border-right: 0; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Logos Doc-Test Reports</h1>
      <div class="subtitle">Live reports from <code id="subtitle-version">main</code> — updated by each repo's CI</div>
    </div>
    <div class="controls">
      <select class="version-select hidden" id="version-select" aria-label="Version"></select>
      <div class="os-toggle" id="os-toggle" role="group" aria-label="Platform"></div>
    </div>
  </header>
  <div class="layout">
    <nav id="sidebar" aria-label="Repositories and tutorials"></nav>
    <div class="empty-state" id="empty">Loading…</div>
    <iframe id="view" title="Doc-test report" class="hidden"></iframe>
  </div>

  <script>
    const view = document.getElementById("view");
    const sidebar = document.getElementById("sidebar");
    const empty = document.getElementById("empty");
    const osToggle = document.getElementById("os-toggle");
    const versionSelect = document.getElementById("version-select");
    const subtitleVersion = document.getElementById("subtitle-version");

    let cfg = null;
    let currentOs = "ubuntu-latest";
    let currentVersion = "main";
    let current = { repo: null, tutorial: null };
    let syncingFromIframe = false;

    function slug(s) {
      return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    }

    function versions() {
      return (cfg && cfg.versions && cfg.versions.length)
        ? cfg.versions
        : [{ id: "main", label: "main", dir: "main" }];
    }

    function findVersion(id) {
      return versions().find(v => v.id === id) || null;
    }

    function defaultVersionId() {
      return (cfg && cfg.defaultVersion) || versions()[0].id;
    }

    function currentVersionDir() {
      const v = findVersion(currentVersion);
      return (v && v.dir) || "main";
    }

    function reposForVersion(versionId) {
      const v = findVersion(versionId);
      const all = (cfg && cfg.repos) || [];
      if (!v || !Array.isArray(v.repos)) return all;
      const allowed = new Set(v.repos);
      return all.filter(r => allowed.has(r.name));
    }

    function reportBase(repo, os) {
      return `https://${cfg.owner}.github.io/${repo}/${currentVersionDir()}/${os}/`;
    }

    function reportUrl(repo, os, tutorialName) {
      const base = reportBase(repo, os);
      if (!tutorialName) return base;
      return base + "#" + encodeURIComponent(slug(tutorialName));
    }

    function hubHash(repo, os, tutorialName, versionId) {
      const parts = [];
      if (versionId && versionId !== defaultVersionId()) parts.push(versionId);
      parts.push(repo, os);
      if (tutorialName) parts.push(slug(tutorialName));
      return "#" + parts.map(encodeURIComponent).join("/");
    }

    function parseHubHash() {
      const raw = location.hash.replace(/^#/, "");
      if (!raw) return null;
      let parts = raw.split("/").map(decodeURIComponent);
      if (parts.length < 1) return null;
      // Leading segment may be a known version id; otherwise default version.
      let version = defaultVersionId();
      if (parts.length && findVersion(parts[0])) {
        version = parts.shift();
      }
      return {
        version,
        repo: parts[0] || null,
        os: parts[1] || cfg.defaultOs,
        tutorialSlug: parts[2] || null,
      };
    }

    function findTutorialBySlug(repoName, tutorialSlug) {
      const repo = cfg.repos.find(r => r.name === repoName);
      if (!repo || !tutorialSlug) return null;
      return (repo.tutorials || []).find(t => slug(t) === tutorialSlug) || null;
    }

    function setActiveLink(repoName, tutorialName) {
      document.querySelectorAll(".tutorial-link").forEach(a => {
        a.classList.toggle(
          "active",
          a.dataset.repo === repoName && a.dataset.tutorial === (tutorialName || "")
        );
      });
    }

    function iframeHasDeepLinks(doc) {
      return Array.from(doc.querySelectorAll("script")).some(
        s => s.textContent && s.textContent.includes("indexFromHash")
      );
    }

    // Same-origin iframes: patch older reports that still call render(0) and
    // ignore the URL hash (e.g. logos-tutorial before logos-doctest deep links
    // landed in CI). Newer reports already handle hash themselves.
    function patchIframeDeepLinks() {
      if (!current.repo) return;
      let doc;
      try {
        doc = view.contentDocument;
      } catch (_) {
        return;
      }
      if (!doc || !doc.getElementById("report-data")) return;

      if (iframeHasDeepLinks(doc)) return;

      if (doc.getElementById("hub-deeplink-patch")) {
        if (doc.defaultView.__hubApplyTutorialHash) {
          doc.defaultView.__hubApplyTutorialHash();
        }
        return;
      }

      const patch = doc.createElement("script");
      patch.id = "hub-deeplink-patch";
      patch.textContent = `
(function() {
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  const picker = document.getElementById("picker");
  if (!picker || !DATA.tutorials) return;

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function indexFromHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return 0;
    if (/^\\d+$/.test(raw) && +raw < DATA.tutorials.length) return +raw;
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === raw || t.meta.name === raw
    );
    return i >= 0 ? i : 0;
  }
  function applyTutorialFromHash() {
    const idx = indexFromHash();
    if (+picker.value !== idx) {
      picker.value = String(idx);
      picker.dispatchEvent(new Event("change"));
    }
  }
  window.__hubApplyTutorialHash = applyTutorialFromHash;
  picker.addEventListener("change", () => {
    const idx = +picker.value;
    const name = DATA.tutorials[idx] && DATA.tutorials[idx].meta.name;
    if (name) location.hash = slug(name);
  });
  window.addEventListener("hashchange", applyTutorialFromHash);
  applyTutorialFromHash();
})();
      `;
      doc.body.appendChild(patch);
    }

    function navigateIframe(url, base) {
      const loadedBase = view.dataset.loadedBase || "";
      const sameDocument = loadedBase === base && view.src && !view.classList.contains("hidden");

      if (sameDocument) {
        try {
          view.contentWindow.location.replace(url);
          patchIframeDeepLinks();
          return;
        } catch (_) {
          /* fall through to full navigation */
        }
      }

      view.dataset.loadedBase = base;
      view.src = url;
    }

    function showReport(repoName, tutorialName, os) {
      current = { repo: repoName, tutorial: tutorialName || null };
      currentOs = os;
      setActiveLink(repoName, tutorialName || "");
      updateOsButtons();

      const base = reportBase(repoName, os);
      const url = reportUrl(repoName, os, tutorialName);
      view.classList.remove("hidden");
      empty.classList.add("hidden");
      navigateIframe(url, base);

      if (!syncingFromIframe) {
        history.replaceState(null, "", hubHash(repoName, os, tutorialName, currentVersion));
      }
    }

    function updateOsButtons() {
      osToggle.querySelectorAll("button").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.os === currentOs);
      });
    }

    function updateSubtitle() {
      const v = findVersion(currentVersion);
      subtitleVersion.textContent = (v && v.label) || currentVersion;
    }

    function buildVersionSelect() {
      versionSelect.innerHTML = "";
      const list = versions();
      list.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.id;
        opt.textContent = v.label || v.id;
        versionSelect.appendChild(opt);
      });
      versionSelect.classList.toggle("hidden", list.length <= 1);
      versionSelect.value = currentVersion;
      versionSelect.onchange = () => switchVersion(versionSelect.value);
    }

    // Switch to a version and select an appropriate repo/tutorial within it.
    function switchVersion(versionId) {
      currentVersion = findVersion(versionId) ? versionId : defaultVersionId();
      versionSelect.value = currentVersion;
      updateSubtitle();
      buildSidebar();

      const repos = reposForVersion(currentVersion);
      // Keep the current repo if it exists in this version, else pick the first.
      const keep = repos.find(r => r.name === current.repo);
      const target = keep || repos[0];
      if (target) {
        const tutorial = (target.tutorials && target.tutorials[0]) || null;
        const tutorialStillValid = keep && current.tutorial &&
          (target.tutorials || []).includes(current.tutorial);
        showReport(target.name, tutorialStillValid ? current.tutorial : tutorial, currentOs);
      } else {
        empty.textContent = "No repositories for this version.";
        empty.classList.remove("hidden");
        view.classList.add("hidden");
      }
    }

    function buildOsToggle() {
      osToggle.innerHTML = "";
      (cfg.osOptions || ["ubuntu-latest"]).forEach(os => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.os = os;
        btn.textContent = os.replace("-latest", "");
        btn.addEventListener("click", () => {
          if (!current.repo) return;
          showReport(current.repo, current.tutorial, os);
        });
        osToggle.appendChild(btn);
      });
    }

    function buildSidebar() {
      sidebar.innerHTML = "";
      reposForVersion(currentVersion).forEach(repo => {
        const block = document.createElement("div");
        block.className = "repo-block";

        const label = document.createElement("div");
        label.className = "repo-label";
        label.textContent = repo.label || repo.name;
        block.appendChild(label);

        const tutorials = repo.tutorials || [];
        if (tutorials.length === 0) {
          const a = document.createElement("a");
          a.href = "#";
          a.className = "tutorial-link";
          a.dataset.repo = repo.name;
          a.dataset.tutorial = "";
          a.textContent = "Combined report";
          a.addEventListener("click", e => {
            e.preventDefault();
            showReport(repo.name, null, currentOs);
          });
          block.appendChild(a);
        } else {
          tutorials.forEach(name => {
            const a = document.createElement("a");
            a.href = "#";
            a.className = "tutorial-link";
            a.dataset.repo = repo.name;
            a.dataset.tutorial = name;
            a.textContent = name;
            a.addEventListener("click", e => {
              e.preventDefault();
              showReport(repo.name, name, currentOs);
            });
            block.appendChild(a);
          });
        }

        sidebar.appendChild(block);
      });
    }

    function selectInitial() {
      const parsed = parseHubHash();
      if (parsed) {
        currentVersion = findVersion(parsed.version) ? parsed.version : defaultVersionId();
      }
      versionSelect.value = currentVersion;
      updateSubtitle();
      buildSidebar();

      const repos = reposForVersion(currentVersion);
      if (parsed && parsed.repo) {
        const repo = repos.find(r => r.name === parsed.repo);
        if (repo) {
          const os = (cfg.osOptions || []).includes(parsed.os) ? parsed.os : cfg.defaultOs;
          let tutorial = null;
          if (parsed.tutorialSlug) {
            tutorial = findTutorialBySlug(parsed.repo, parsed.tutorialSlug);
          }
          if (!tutorial && repo.tutorials && repo.tutorials.length) {
            tutorial = repo.tutorials[0];
          }
          showReport(parsed.repo, tutorial, os);
          return;
        }
      }

      const first = repos[0];
      if (first) {
        const tutorial = (first.tutorials && first.tutorials[0]) || null;
        showReport(first.name, tutorial, cfg.defaultOs || "ubuntu-latest");
      } else {
        empty.textContent = "No repositories configured.";
        empty.classList.remove("hidden");
        view.classList.add("hidden");
      }
    }

    view.addEventListener("load", () => {
      if (!current.repo || !view.contentWindow) return;
      view.dataset.loadedBase = reportBase(current.repo, currentOs);
      patchIframeDeepLinks();
      try {
        const iframeHash = view.contentWindow.location.hash.replace(/^#/, "");
        if (!iframeHash) return;
        const tutorial = findTutorialBySlug(current.repo, decodeURIComponent(iframeHash));
        if (tutorial && tutorial !== current.tutorial) {
          syncingFromIframe = true;
          current.tutorial = tutorial;
          setActiveLink(current.repo, tutorial);
          history.replaceState(null, "", hubHash(current.repo, currentOs, tutorial));
          syncingFromIframe = false;
        }
      } catch (_) {
        /* not yet loaded */
      }
    });

    window.addEventListener("hashchange", () => {
      if (syncingFromIframe || !cfg) return;
      const parsed = parseHubHash();
      if (!parsed || !parsed.repo) return;
      const version = findVersion(parsed.version) ? parsed.version : defaultVersionId();
      if (version !== currentVersion) {
        currentVersion = version;
        versionSelect.value = currentVersion;
        updateSubtitle();
        buildSidebar();
      }
      // Ignore repos not available in the selected version.
      if (!reposForVersion(currentVersion).some(r => r.name === parsed.repo)) return;
      const tutorial = parsed.tutorialSlug
        ? findTutorialBySlug(parsed.repo, parsed.tutorialSlug)
        : null;
      showReport(parsed.repo, tutorial, parsed.os || cfg.defaultOs);
    });

    fetch("repos.json")
      .then(r => {
        if (!r.ok) throw new Error("Failed to load repos.json");
        return r.json();
      })
      .then(data => {
        cfg = data;
        currentOs = cfg.defaultOs || "ubuntu-latest";
        currentVersion = defaultVersionId();
        buildVersionSelect();
        buildOsToggle();
        selectInitial();
      })
      .catch(err => {
        empty.textContent = "Could not load configuration: " + err.message;
      });
  </script>
</body>
</html>
